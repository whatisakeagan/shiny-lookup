<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Pokémon Collection Lookup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        #searchInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            outline: none;
        }
        
        #searchInput:focus {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 16px;
            margin-top: 20px;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
        }
        
        .results {
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .result-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 22px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .missing-section {
            margin-bottom: 15px;
        }
        
        .missing-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .missing-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .missing-tag {
            background: #fff3cd;
            color: #856404;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #ffc107;
        }
        
        .complete-tag {
            background: #d4edda;
            color: #155724;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #28a745;
        }
        
        .owned-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        
        .owned-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .owned-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .owned-tag {
            background: #e8f4fd;
            color: #1565c0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #90caf9;
        }
        
        .no-results {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #888;
        }
        
        .count {
            color: white;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .toggle-owned {
            background: none;
            border: none;
            color: #667eea;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: underline;
        }
        
        .owned-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        
        .owned-details.show {
            display: block;
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .detail-value {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        
        .owned-entry {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        
        .owned-entry:last-child {
            margin-bottom: 0;
        }
        
        .owned-entry-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Shiny Collection Lookup</h1>
        
        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by species name..."
                autocomplete="off"
            >
        </div>
        
        <div id="loading" class="loading">Loading your collection...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="count" class="count"></div>
        <div id="results" class="results"></div>
    </div>

    <script>
        const SHEET_ID = '1xXugW2exvTymh1GgjvVX2i0rMVWANwMn3dE58jU5hbU';
        const OWNED_SHEET = 'ZA_Owned_Detailed';
        const COMBOS_SHEET = 'ZA_Combinations';
        const API_KEY = 'AIzaSyBbr5tXG1SwQL7qcLh1RYH9QnCiD18wU_g';
        
        let ownedData = [];
        let combosData = [];
        
        // Create a key for comparison (species + region + cosmetic + gender + alpha)
        function makeKey(pokemon) {
            return [
                (pokemon.Species || '').toLowerCase().trim(),
                (pokemon['Region Form'] || '').toLowerCase().trim(),
                (pokemon['Cosmetic Form'] || '').toLowerCase().trim(),
                (pokemon.Gender || '').toLowerCase().trim(),
                (pokemon['Alpha State'] || '').toLowerCase().trim()
            ].join('|');
        }
        
        // Create display label for a combination
        function makeDisplayLabel(pokemon) {
            const parts = [];
            
            // Add Alpha first if applicable
            if (pokemon['Alpha State'] && pokemon['Alpha State'].toLowerCase() === 'alpha') {
                parts.push('Alpha');
            }
            
            // Add Region Form
            if (pokemon['Region Form']) {
                parts.push(pokemon['Region Form']);
            }
            
            // Add Cosmetic Form
            if (pokemon['Cosmetic Form']) {
                parts.push(pokemon['Cosmetic Form']);
            }
            
            // Add Gender
            if (pokemon.Gender) {
                parts.push(pokemon.Gender);
            }
            
            // If nothing special, just say Regular
            if (parts.length === 0) {
                return 'Regular';
            }
            
            // If only non-alpha attributes, might want to clarify it's regular
            if (!parts.includes('Alpha') && pokemon['Alpha State'] && pokemon['Alpha State'].toLowerCase() === 'regular') {
                // Only add "Regular" if there are other distinguishing features
                // Otherwise the label would just be the form/gender
            }
            
            return parts.join(' ');
        }
        
        // Fetch data from a sheet
        async function fetchSheet(sheetName) {
            const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${sheetName}?key=${API_KEY}`;
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`Failed to fetch ${sheetName}`);
            }
            
            const data = await response.json();
            const rows = data.values;
            const headers = rows[0];
            
            return rows.slice(1).map(row => {
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = row[index] || '';
                });
                return obj;
            });
        }
        
        // Fetch all data
        async function fetchAllData() {
            try {
                [ownedData, combosData] = await Promise.all([
                    fetchSheet(OWNED_SHEET),
                    fetchSheet(COMBOS_SHEET)
                ]);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('searchInput').disabled = false;
                document.getElementById('searchInput').focus();
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = 'Error loading data: ' + error.message;
                errorDiv.style.display = 'block';
            }
        }
        
        // Toggle owned details visibility
        function toggleOwned(button) {
            const details = button.nextElementSibling;
            details.classList.toggle('show');
            button.textContent = details.classList.contains('show') 
                ? 'Hide owned details' 
                : 'Show owned details';
        }
        
        // Filter and display results
        function filterResults(searchTerm) {
            const resultsDiv = document.getElementById('results');
            const countDiv = document.getElementById('count');
            
            if (!searchTerm.trim()) {
                resultsDiv.classList.remove('show');
                countDiv.textContent = '';
                return;
            }
            
            const searchLower = searchTerm.toLowerCase();
            
            // Get all possible combinations for matching species
            const matchingCombos = combosData.filter(pokemon => 
                pokemon.Species.toLowerCase().includes(searchLower)
            );
            
            // Get all owned for matching species
            const matchingOwned = ownedData.filter(pokemon => 
                pokemon.Species.toLowerCase().includes(searchLower)
            );
            
            if (matchingCombos.length === 0 && matchingOwned.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No Pokémon found matching "' + searchTerm + '"</div>';
                resultsDiv.classList.add('show');
                countDiv.textContent = '';
                return;
            }
            
            // Group by species
            const speciesSet = new Set([
                ...matchingCombos.map(p => p.Species),
                ...matchingOwned.map(p => p.Species)
            ]);
            
            countDiv.textContent = `Found ${speciesSet.size} species`;
            
            // Build results for each species
            const resultsHTML = Array.from(speciesSet).map(species => {
                const combosForSpecies = matchingCombos.filter(p => p.Species === species);
                const ownedForSpecies = matchingOwned.filter(p => p.Species === species);
                
                // Create set of owned keys
                const ownedKeys = new Set(ownedForSpecies.map(makeKey));
                
                // Find missing combinations
                const missing = combosForSpecies.filter(combo => !ownedKeys.has(makeKey(combo)));
                
                // Create owned summary tags (unique combinations owned)
                const ownedCombosMap = new Map();
                ownedForSpecies.forEach(pokemon => {
                    const label = makeDisplayLabel(pokemon);
                    if (!ownedCombosMap.has(label)) {
                        ownedCombosMap.set(label, []);
                    }
                    ownedCombosMap.get(label).push(pokemon);
                });
                
                // Missing section HTML
                let missingHTML = '';
                if (missing.length === 0) {
                    missingHTML = `
                        <div class="missing-section">
                            <div class="missing-label">Status</div>
                            <div class="missing-tags">
                                <span class="complete-tag">✓ Complete!</span>
                            </div>
                        </div>
                    `;
                } else {
                    const missingTags = missing.map(m => 
                        `<span class="missing-tag">${makeDisplayLabel(m)}</span>`
                    ).join('');
                    missingHTML = `
                        <div class="missing-section">
                            <div class="missing-label">Missing (${missing.length})</div>
                            <div class="missing-tags">${missingTags}</div>
                        </div>
                    `;
                }
                
                // Owned summary tags
                const ownedTags = Array.from(ownedCombosMap.keys()).map(label => 
                    `<span class="owned-tag">${label}</span>`
                ).join('');
                
                const ownedSummaryHTML = ownedForSpecies.length > 0 ? `
                    <div class="owned-section">
                        <div class="owned-label">Owned (${ownedForSpecies.length})</div>
                        <div class="owned-tags">${ownedTags}</div>
                    </div>
                ` : '';
                
                // Detailed owned entries (collapsible)
                const ownedDetailsHTML = ownedForSpecies.length > 0 ? `
                    <button class="toggle-owned" onclick="toggleOwned(this)">Show owned details</button>
                    <div class="owned-details">
                        ${ownedForSpecies.map(pokemon => `
                            <div class="owned-entry">
                                <div class="owned-entry-header">${makeDisplayLabel(pokemon)}</div>
                                <div class="detail-grid">
                                    <div class="detail-item">
                                        <span class="detail-label">Ball</span>
                                        <span class="detail-value">${pokemon.Ball || '—'}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Nature</span>
                                        <span class="detail-value">${pokemon.Nature || '—'}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Location</span>
                                        <span class="detail-value">${pokemon.Location || '—'}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">Game</span>
                                        <span class="detail-value">${pokemon.Game || '—'}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">OT</span>
                                        <span class="detail-value">${pokemon.OT || '—'}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="detail-label">TID</span>
                                        <span class="detail-value">${pokemon.TID || '—'}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : '';
                
                return `
                    <div class="result-card">
                        <h3>${species}</h3>
                        ${missingHTML}
                        ${ownedSummaryHTML}
                        ${ownedDetailsHTML}
                    </div>
                `;
            }).join('');
            
            resultsDiv.innerHTML = resultsHTML;
            resultsDiv.classList.add('show');
        }
        
        // Event listener for search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
            filterResults(e.target.value);
        });
        
        // Disable input until data is loaded
        document.getElementById('searchInput').disabled = true;
        
        // Load data on page load
        fetchAllData();
    </script>
</body>
</html>
